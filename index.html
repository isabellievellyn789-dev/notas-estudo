<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Exemplo</title>
    <link rel="stylesheet" href="./style/exemplo.css">
</head>
<body>
   
    <!-- Cabeçalho -->
    <header>
        <h1>Minha Página HTML Batata</h1>
    <nav>
        <a href="./atividade.html">atividade</a>
    </nav>
    </header>
 
    <!-- Corpo da página -->
    <main>
        <section>
            <h2>Seção de Listas</h2>
            <div class="container">
                <!-- Lista não ordenada -->
                <div>
                    <h3>Lista não ordenada:</h3>
                    <ul>
                        <li>Item 1</li>
                        <li>Item 2</li>
                        <li>Item 3</li>
                    </ul>
                </div>
                <!-- Lista ordenada -->
                <div>
                    <h3>Lista ordenada:</h3>
                    <ol>
                        <li>Primeiro item</li>
                        <li>Segundo item</li>
                        <li>Terceiro item</li>
                        <p>teste </p>
                    </ol>
                </div>
            </div>
        </section>
 
   <section>

       <h2>Como incorporar imagens e videos</h2>
       
       <img src="https://jpimg.com.br/uploads/2023/11/12-cuidados-importantes-com-o-cachorro-na-praia.jpg" alt="cachorro naa praia">
       <iframe width="560" height="315" src="https://www.youtube.com/embed/SZ9wU9Twzp0?si=7u2EPey_njaw2Ea3" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </section>
  
<section>

   
<h2>formulario simples</h2>
<form action="">
<label for="nome">nome:</label>
 <input type="text" id="nome" required>

<br>

 <label for="email">email:</label>
 <input type="email"id="email" required>

 <br>

 <label for="mensagem">mensagem:</label>
 <textarea id="mensagem">escreva algo aqui</textarea>

 <br>

 <label for="idade">idade</label>
 <input type="number" id="idade" min="10" max="20" required>

 <br>

 <label for="cor">cor</label>
 <input type="color" id="cor" required> 

 <br>

 <label for="anexo">anexo:</label>
 <input type="file"id=anexo required>

 <br>

 <button  type="submit">enviar</button>
 <button type="reset">limpar</button>
</form>
</section>

</body>
</html>
